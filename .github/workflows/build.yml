name: Build FlowDroid

concurrency:
  group: flowdroid-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FlowDroid.sln

      - name: Build
        run: dotnet build FlowDroid.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/FlowDroid.App/FlowDroid.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true --output artifacts/FlowDroid

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\FlowDroid.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FlowDroid-win-x64
          path: artifacts/FlowDroid/
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FlowDroid-Setup
          path: artifacts/installer/FlowDroid-Setup-0.1.1.exe
          if-no-files-found: error
